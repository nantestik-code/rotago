<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="RotaGo">
  <defs>
    <linearGradient id="rg-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Fundo: quadrado arredondado, sangria total para legibilidade em 16px -->
  <rect width="64" height="64" rx="15" fill="url(#rg-bg)"/>

  <!-- Rota: traco branco espesso ligando a origem ao destino -->
  <path d="M18 46 C18 34 32 39 34 28 C35.5 21 39 20 44 20"
        fill="none" stroke="#ffffff" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Origem -->
  <circle cx="18" cy="46" r="6.5" fill="#ffffff"/>
  <circle cx="18" cy="46" r="2.75" fill="#2563eb"/>

  <!-- Destino -->
  <circle cx="44" cy="20" r="9" fill="#facc15"/>
  <circle cx="44" cy="20" r="3.5" fill="#1e3a8a"/>
</svg>
