<!DOCTYPE html>
<html>
<head>
    <title>Test Environment Variables</title>
</head>
<body>
    <h1>Environment Variables Test</h1>
    <div id="results"></div>
    
    <script type="module">
        console.log('Testing environment variables...');
        
        const supabaseUrl = import.meta.env.VITE_SUPABASE_URL;
        const supabaseAnonKey = import.meta.env.VITE_SUPABASE_ANON_KEY;
        
        console.log('SUPABASE_URL:', supabaseUrl);
        console.log('ANON_KEY (first 20 chars):', supabaseAnonKey?.substring(0, 20));
        
        const results = document.getElementById('results');
        results.innerHTML = `
            <p><strong>SUPABASE_URL:</strong> ${supabaseUrl || 'UNDEFINED'}</p>
            <p><strong>ANON_KEY:</strong> ${supabaseAnonKey ? supabaseAnonKey.substring(0, 20) + '...' : 'UNDEFINED'}</p>
        `;
        
        if (!supabaseUrl || !supabaseAnonKey) {
            console.error('Some environment variables are undefined');
            results.innerHTML += '<p style="color: red;"><strong>ERROR:</strong> Some variables are undefined.</p>';
        } else {
            console.log('Environment variables are defined');
            results.innerHTML += '<p style="color: green;"><strong>OK:</strong> Required variables are defined.</p>';
        }
    </script>
</body>
</html>
